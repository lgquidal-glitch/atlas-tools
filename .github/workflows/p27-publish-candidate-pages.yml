name: P27 publish candidate pages
on:
  push:
    branches: [p27-consolidation-candidate]
    paths:
      - '.github/workflows/p27-publish-candidate-pages.yml'
      - 'web/data/football-*.json'
      - 'web/data/football-coverage.json'
      - 'web/data/tennis-feed.json'
      - 'web/data/football-history.json'
      - 'web/data/tennis-history.json'
      - 'web/football-resilient-loader.js'
      - 'web/tennis-resilient-loader.js'
      - 'web/football-command/index.html'
      - 'web/football-deep/index.html'
      - 'web/football-fusion/index.html'
      - 'web/tennis-command/index.html'
      - 'web/tennis-deep/index.html'
      - 'web/tennis-fusion/index.html'
      - 'web/calibration/index.html'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p27-consolidation-candidate
          fetch-depth: 0
      - name: Verify candidate source bundle before publication
        shell: bash
        run: |
          set -euo pipefail
          test -f web/tennis-resilient-loader.js
          test -f web/football-resilient-loader.js
          for f in web/tennis-command/index.html web/tennis-deep/index.html web/tennis-fusion/index.html; do grep -q 'atlas-p27-tennis-resilient-loader' "$f"; done
          for f in web/football-command/index.html web/football-deep/index.html web/football-fusion/index.html; do grep -q 'atlas-p27-football-resilient-loader' "$f"; done
          test -f web/data/tennis-feed.json
          test -f web/data/football-coverage.json
      - name: Stage candidate web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p27-web
          mkdir -p /tmp/p27-web
          cp -a web/. /tmp/p27-web/
      - name: Publish under isolated gh-pages subpath
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git checkout -B gh-pages origin/gh-pages
          rm -rf p27-candidate
          mkdir -p p27-candidate
          cp -a /tmp/p27-web/. p27-candidate/
          printf '%s\n' 'P27 candidate - isolated test copy. Active root remains unchanged.' > p27-candidate/CANDIDATE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p27-candidate
          if git diff --cached --quiet; then echo 'No candidate changes to publish'; else git commit -m 'Publish isolated P27 candidate under subpath'; git push origin gh-pages; fi
      - name: Verify active root and candidate coexist
        shell: bash
        run: |
          set -euo pipefail
          test -f tennis-command/index.html
          test -f p27-candidate/tennis-command/index.html
          test -f p27-candidate/data/tennis-feed.json
          test -f p27-candidate/tennis-resilient-loader.js
          test -f p27-candidate/football-resilient-loader.js
          for f in p27-candidate/tennis-command/index.html p27-candidate/tennis-deep/index.html p27-candidate/tennis-fusion/index.html; do grep -q 'atlas-p27-tennis-resilient-loader' "$f"; done
          for f in p27-candidate/football-command/index.html p27-candidate/football-deep/index.html p27-candidate/football-fusion/index.html; do grep -q 'atlas-p27-football-resilient-loader' "$f"; done
          echo 'active_root_preserved=yes'
          echo 'candidate_subpath_present=yes'
          echo 'tennis_resilient_loader_present=yes'
          echo 'football_resilient_loader_present=yes'
