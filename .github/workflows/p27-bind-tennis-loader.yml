name: P27 bind tennis loader
on:
  push:
    branches: [p27-consolidation-candidate]
    paths:
      - '.github/workflows/p27-bind-tennis-loader.yml'
      - 'p27/tennis-resilient-loader.js'
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p27-consolidation-candidate
          fetch-depth: 0
      - name: Bind current Tennis feed loader to all three Tennis interfaces
        shell: bash
        run: |
          set -euo pipefail
          cp p27/tennis-resilient-loader.js web/tennis-resilient-loader.js
          python - <<'PY'
          from pathlib import Path
          files=[Path('web/tennis-command/index.html'),Path('web/tennis-deep/index.html'),Path('web/tennis-fusion/index.html')]
          tag='\n<script id="atlas-p27-tennis-resilient-loader" src="../tennis-resilient-loader.js"></script>\n'
          for p in files:
              s=p.read_text(encoding='utf-8')
              if 'atlas-p27-tennis-resilient-loader' not in s:
                  if '</body>' not in s: raise SystemExit(f'Missing body close: {p}')
                  s=s.replace('</body>',tag+'</body>',1)
                  p.write_text(s,encoding='utf-8')
          for p in files:
              s=p.read_text(encoding='utf-8')
              assert 'atlas-p27-tennis-resilient-loader' in s
          print('Tennis loader bound to 3/3 interfaces')
          PY
      - name: Commit binding
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/tennis-resilient-loader.js web/tennis-command/index.html web/tennis-deep/index.html web/tennis-fusion/index.html
          if git diff --cached --quiet; then echo 'No binding changes'; else git commit -m 'Bind current P27 Tennis feed to three interfaces'; git push origin HEAD:p27-consolidation-candidate; fi
