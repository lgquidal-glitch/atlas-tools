name: ATLAS Tennis — ESPN guarded refresh QA [HOLD]
on:
  pull_request:
    paths:
      - 'staging/tennis/check_espn_refresh.py'
      - 'staging/tennis/build_public_source.py'
      - '.github/workflows/atlas-tennis-staging-refresh-qa.yml'
  push:
    branches:
      - atlas-tennis-data-stage-20261009
    paths:
      - 'staging/tennis/check_espn_refresh.py'
      - '.github/workflows/atlas-tennis-staging-refresh-qa.yml'
permissions:
  contents: read
jobs:
  gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture protected multisource staging snapshot hash
        run: sha256sum staging/tennis/atlas-tennis-source-HOLD.json > /tmp/atlas-protected-source.sha256
      - name: Fetch actual ESPN events and produce a provisional candidate
        run: python staging/tennis/build_public_source.py --output qa_out/fresh.json
      - name: Test real provisional candidate through staging safety gate
        run: |
          python staging/tennis/check_espn_refresh.py --candidate qa_out/fresh.json --output qa_out/gate.json
          python - <<'PY'
          import json
          d=json.load(open('qa_out/fresh.json'))
          g=json.load(open('qa_out/gate.json'))
          assert g['productionModified'] is False and g['canonicalMultisourceModified'] is False
          assert g['mode'] in ('STAGING_HOLD_PUBLISH','REJECT_KEEP_PREVIOUS')
          assert not g['betclicCertified'] and not g['liveCertified']
          print('ACTUAL SOURCE',d['generatedAt'],d['rowsCount'],g)
          PY
      - name: Negatives — reject duplicate, partial coverage and regressive update
        run: |
          python - <<'PY'
          import sys,copy,json
          sys.path.insert(0,'staging/tennis')
          from check_espn_refresh import check
          raw=json.load(open('qa_out/fresh.json'))
          duplicates=copy.deepcopy(raw)
          duplicates['rows'][1]['event_id']=duplicates['rows'][0]['event_id']
          assert not check(duplicates)['acceptedForStaging']
          missing=copy.deepcopy(raw)
          missing['rows']=[m for m in missing['rows'] if m['date']!=raw['sourceCoverage'][1]['date']]
          missing['rowsCount']=len(missing['rows']);missing['uniqueIds']=len(missing['rows'])
          assert not check(missing)['acceptedForStaging']
          stale=copy.deepcopy(raw)
          stale['generatedAt']='2026-01-01T00:00:00+00:00'
          assert not check(stale)['acceptedForStaging']
          bad=copy.deepcopy(raw)
          bad['betclicCertified']=True
          assert not check(bad)['acceptedForStaging']
          previous=copy.deepcopy(raw);previous['rows']=raw['rows']*2
          assert not check(raw,previous)['acceptedForStaging']
          print('ATLAS STAGING NON-REGRESSION: 5 negative cases passed')
          PY
      - name: Verify canonical source unaffected
        run: sha256sum -c /tmp/atlas-protected-source.sha256
      - name: Retain test evidence — no publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-ESPN-STAGING-GATE-QA-HOLD
          path: |
            qa_out/gate.json
            qa_out/fresh.json
          if-no-files-found: warn
          retention-days: 3
