name: P27 source probe push
on:
  push:
    paths:
      - '.github/workflows/p27-probe-push.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe alternate live endpoints and record result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p27
          python3 - <<'PY'
          import json, urllib.request, datetime
          date=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          out={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'date':date,'probes':[]}
          endpoints=[]
          for sport in ('tennis','football'):
              endpoints += [
                (sport,'sofascore-www',f'https://www.sofascore.com/api/v1/sport/{sport}/scheduled-events/{date}'),
                (sport,'sofascore-api',f'https://api.sofascore.com/api/v1/sport/{sport}/scheduled-events/{date}')
              ]
          for sport,provider,url in endpoints:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Referer':'https://www.sofascore.com/'})
              row={'sport':sport,'provider':provider,'url':url}
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); row['http']=r.status; row['contentType']=r.headers.get('content-type'); row['bytes']=len(raw)
                      d=json.loads(raw); ev=d.get('events',[]) if isinstance(d,dict) else []
                      row['events']=len(ev); row['ok']=bool(r.status==200 and isinstance(ev,list))
                      if ev:
                          e=ev[0]; row['sample']={'id':e.get('id'),'home':(e.get('homeTeam') or {}).get('name'),'away':(e.get('awayTeam') or {}).get('name'),'status':(e.get('status') or {}).get('type')}
              except Exception as e:
                  row['ok']=False; row['error']=repr(e)
              out['probes'].append(row)
          open('p27/probe-result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          cat p27/probe-result.json
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p27/probe-result.json
          git diff --cached --quiet || git commit -m 'Record P27 alternate source probe result'
          git push
