name: P27 source probe push
on:
  push:
    paths:
      - '.github/workflows/p27-probe-push.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests beautifulsoup4
      - name: Inspect TennisExplorer structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p27
          python3 - <<'PY'
          import json, datetime, requests
          from bs4 import BeautifulSoup
          now=datetime.datetime.now(datetime.timezone.utc); d=now.date();
          u=f'https://www.tennisexplorer.com/matches/?type=all&year={d.year}&month={d.month:02d}&day={d.day:02d}'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30); r.raise_for_status(); s=BeautifulSoup(r.text,'html.parser')
          rows=[]
          for tr in s.find_all('tr'):
            text=' | '.join(tr.stripped_strings)
            if not text: continue
            rows.append({'class':tr.get('class',[]),'id':tr.get('id'),'text':text[:800],'links':[{'text':a.get_text(' ',strip=True)[:100],'href':a.get('href')} for a in tr.find_all('a')[:8]]})
            if len(rows)>=80: break
          out={'generatedAt':now.isoformat(),'url':u,'http':r.status_code,'bytes':len(r.content),'rows':rows}
          open('p27/probe-result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          cat p27/probe-result.json
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p27/probe-result.json
          git diff --cached --quiet || git commit -m 'Record TennisExplorer structure for P27'
          git push
