name: P27 source probe
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'ATLAS-P27-SOURCE-PROBE')
    runs-on: ubuntu-latest
    steps:
      - name: Probe public live endpoints
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          urls=(
            "https://www.sofascore.com/api/v1/sport/tennis/scheduled-events/${DATE}"
            "https://www.sofascore.com/api/v1/sport/football/scheduled-events/${DATE}"
          )
          : > probe.txt
          for u in "${urls[@]}"; do
            echo "URL=$u" | tee -a probe.txt
            tmp=$(mktemp)
            code=$(curl -L --retry 2 --connect-timeout 20 --max-time 60 -A 'Mozilla/5.0 ATLAS-P27' -sS -o "$tmp" -w '%{http_code}' "$u" || true)
            ctype=$(curl -L --retry 1 --connect-timeout 20 --max-time 60 -A 'Mozilla/5.0 ATLAS-P27' -sSI "$u" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -n1 || true)
            echo "HTTP=$code CT=$ctype BYTES=$(wc -c < "$tmp")" | tee -a probe.txt
            python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p,encoding="utf-8")); print("JSON_KEYS="+",".join(list(d.keys())[:20]) if isinstance(d,dict) else "JSON_TYPE="+type(d).__name__); ev=d.get("events") if isinstance(d,dict) else None; print("EVENTS="+str(len(ev) if isinstance(ev,list) else "NA")); e=ev[0] if isinstance(ev,list) and ev else {}; print("SAMPLE_ID="+str(e.get("id"))); print("SAMPLE_HOME="+str((e.get("homeTeam") or {}).get("name"))); print("SAMPLE_AWAY="+str((e.get("awayTeam") or {}).get("name"))); print("SAMPLE_STATUS="+str((e.get("status") or {}).get("type")))' "$tmp" | tee -a probe.txt || echo "JSON_PARSE_FAILED" | tee -a probe.txt
            rm -f "$tmp"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: p27-source-probe
          path: probe.txt
