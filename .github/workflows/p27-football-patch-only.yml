name: P27 football patch only
on:
  push:
    branches:
      - p27-consolidation-candidate
    paths:
      - .github/workflows/p27-football-patch-only.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p27-consolidation-candidate
      - name: Inject loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          loader=Path('p27/football-resilient-loader.js').read_text(encoding='utf-8')
          block='<script id="atlas-p27-football-resilient-loader">\n'+loader+'\n</script>\n'
          for p in ['web/football-command/index.html','web/football-deep/index.html','web/football-fusion/index.html']:
              path=Path(p)
              s=path.read_text(encoding='utf-8')
              if 'atlas-p27-football-resilient-loader' not in s:
                  s=s.replace('</body>',block+'</body>')
                  path.write_text(s,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in ['web/football-command/index.html','web/football-deep/index.html','web/football-fusion/index.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert 'atlas-p27-football-resilient-loader' in s
              assert 'https://site.api.espn.com' not in s
          print('P27 FOOTBALL PATCH PASS 3/3')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/football-command/index.html web/football-deep/index.html web/football-fusion/index.html
          git diff --cached --quiet || git commit -m 'Inject resilient P27 football loader'
          git push origin HEAD:p27-consolidation-candidate
