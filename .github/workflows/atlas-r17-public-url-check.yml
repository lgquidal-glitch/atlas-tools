name: ATLAS R17 public URLs integrity verification [HOLD]
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-r17-public-url-check.yml'
permissions:
  contents: read
jobs:
  verify-r17-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm A+B real public HTTP 200 and R17 identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, time, hashlib
          for branch in ('a','b'):
            url='https://lgquidal-glitch.github.io/atlas-tools/atlas-previews/r17/'+branch+'/'
            good=False;issues=[]
            for attempt in range(8):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ATLAS-R17-READONLY-PREVIEW-CHECK'}),timeout=15) as r:
                  data=r.read()
                  good = r.status==200 and b'atlas-r17-mobile-nonregression' in data and b'atlasR17DataContext' in data and b'atlasR16LiveCards' in data
                  if good:
                    print('ATLAS_R17_HTTP_PASS',branch.upper(),url,'bytes',len(data),'SHA256',hashlib.sha256(data).hexdigest())
                    break
                  issues.append('wrong-content-or-status')
              except Exception as e:issues.append(str(e)[:120])
              time.sleep(3)
            if not good:
              print('ATLAS_R17_URL_HOLD',branch,issues)
              raise SystemExit(1)
          print('ATLAS R17 BOTH PUBLIC URLs: HTTP 200 + R17 content PASS')
          PY
