name: Rebuild ATLAS exact mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-atlas-exact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v4
      - name: Download exact private export
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/atlas-exact-web.zip 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4c34-81f4-a3fe-b6a8ca82a42b/raw?se=2026-09-12T07%3A13%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=75dce147-b5a6-5bbd-aef7-96d3aaa43ac5&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T06%3A36%3A21Z&ske=2026-09-13T06%3A36%3A21Z&sks=b&skv=2026-02-06&sig=3ZMgn3buWyWfn/KshyUaTq8ofSiW/g1sCWdl3TQBjEY%3D'
          rm -rf /tmp/exact && mkdir -p /tmp/exact
          unzip -q /tmp/atlas-exact-web.zip -d /tmp/exact
          (cd /tmp/exact && sha256sum -c atlas-exact-web.sha256)
          rm -rf web
          mkdir -p web
          tar -xzf /tmp/exact/atlas-exact-web.tar.gz -C web --strip-components=1
          find web -maxdepth 2 -type f -name index.html -printf '%p %s bytes\n' | sort
      - name: Commit exact seven tools
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'ATLAS Repair Bot'
          git config user.email 'actions@github.com'
          git add web
          git commit -m 'Restore exact ATLAS web tools from private export' || exit 0
          git push origin HEAD:main
