name: P27 repair football broker and full QA
on:
  push:
    branches: [p27-consolidation-candidate]
    paths:
      - '.github/workflows/p27-repair-football-and-qa.yml'
permissions:
  contents: write
jobs:
  repair-publish-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p27-consolidation-candidate
          fetch-depth: 0
      - name: Inject resilient football loader into 3 interfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          files=['web/football-command/index.html','web/football-deep/index.html','web/football-fusion/index.html']
          block=r'''
<script id="atlas-p27-football-resilient-loader">
(function(){
  const CODES={en:'eng.1',fr:'fra.1',es:'esp.1',de:'ger.1',it:'ita.1',sa:'ksa.1'};
  const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const pair=(a,b)=>[norm(a),norm(b)].sort().join('|');
  function stateOf(c){
    const t=(c?.status?.type?.state||c?.status?.type?.name||c?.status?.type?.description||'').toString().toLowerCase();
    if(/post|final|completed|full time|ft/.test(t))return'post';
    if(/in|live|progress|half|ht/.test(t))return'in';
    return'pre';
  }
  function scoreOf(x){
    const v=x?.score;
    if(v===undefined||v===null||v==='')return null;
    if(typeof v==='object')return v.displayValue??v.value??null;
    return v;
  }
  function applyFeed(code,j){
    try{
      if(typeof fixtures==='undefined'||!Array.isArray(fixtures))return 0;
      const league=Object.entries(CODES).find(([,v])=>v===code)?.[0]||'';
      let hits=0;
      for(const ev of (j?.events||[])) for(const c of (ev?.competitions||[])){
        const cs=c?.competitors||[];
        const h=cs.find(x=>x.homeAway==='home')||cs[0], a=cs.find(x=>x.homeAway==='away')||cs[1];
        const hn=h?.team?.displayName||h?.team?.shortDisplayName||h?.athlete?.displayName||'';
        const an=a?.team?.displayName||a?.team?.shortDisplayName||a?.athlete?.displayName||'';
        if(!hn||!an)continue;
        const k=pair(hn,an), st=stateOf(c), detail=c?.status?.type?.shortDetail||c?.status?.type?.detail||'';
        for(const f of fixtures){
          if(f?.l!==league||pair(f?.h,f?.a)!==k)continue;
          f._atlasLiveState=st;f._atlasLiveDetail=detail;f._atlasLiveUpdatedAt=new Date().toISOString();
          if(st==='post'){
            const hs=scoreOf(h),as=scoreOf(a);
            if(hs!==null&&as!==null)f.s=String(hs)+'-'+String(as);
          }
          hits++;
        }
      }
      return hits;
    }catch(e){return 0}
  }
  async function load(){
    const feed={};let providersOk=0,matchesUpdated=0,totalEvents=0;
    await Promise.all(Object.values(CODES).map(async code=>{
      try{
        const r=await fetch(`../data/football-${code}.json?ts=${Date.now()}`,{cache:'no-store'});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const j=await r.json();feed[code]=j;providersOk++;totalEvents+=(j?.events||[]).length;matchesUpdated+=applyFeed(code,j);
      }catch(e){feed[code]={error:String(e),events:[]};}
    }));
    window.ATLAS_FOOT_SOURCE_FEED=feed;
    window.ATLAS_FOOT_LIVE_STATUS={ok:providersOk>0,updatedAt:new Date().toISOString(),providersOk,totalEvents,matchesUpdated,source:'ATLAS same-origin broker · resilient loader'};
    try{if(typeof window.ATLAS_FOOT_APPLY_SOURCE_FEED==='function')window.ATLAS_FOOT_APPLY_SOURCE_FEED(feed)}catch(e){}
    try{if(typeof render==='function')render()}catch(e){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(load,50),{once:true});else setTimeout(load,50);
  setInterval(load,60000);
})();
</script>
'''
          for p in files:
            path=pathlib.Path(p); s=path.read_text(encoding='utf-8')
            if 'atlas-p27-football-resilient-loader' in s: continue
            if '</body>' not in s: raise SystemExit('missing body '+p)
            path.write_text(s.replace('</body>',block+'\n</body>'),encoding='utf-8')
          PY
      - name: Static safety gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile,os
          files=['web/football-command/index.html','web/football-deep/index.html','web/football-fusion/index.html']
          for p in files:
            s=pathlib.Path(p).read_text(encoding='utf-8')
            assert 'atlas-p27-football-resilient-loader' in s
            assert 'https://site.api.espn.com' not in s
            ids=re.findall(r'\bid=["\']([^"\']+)',s,re.I)
            assert len(ids)==len(set(ids)),(p,'duplicate ids')
            for m in re.finditer(r'<script(?![^>]+type=["\'](?:application/json|text/plain)["\'])[^>]*>(.*?)</script>',s,re.I|re.S):
              code=m.group(1).strip()
              if not code: continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as t:t.write(code);n=t.name
              r=subprocess.run(['node','--check',n],capture_output=True,text=True);os.unlink(n)
              if r.returncode: raise SystemExit(p+' JS '+r.stderr[-500:])
          print('STATIC FOOTBALL PASS 3/3')
          PY
      - name: Commit repaired candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/football-command/index.html web/football-deep/index.html web/football-fusion/index.html
          git diff --cached --quiet || git commit -m 'Repair P27 football same-origin runtime broker'
          git push origin HEAD:p27-consolidation-candidate
      - name: Publish candidate only under isolated subpath
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p27-web;mkdir -p /tmp/p27-web;cp -a web/. /tmp/p27-web/
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git checkout -B gh-pages origin/gh-pages
          rm -rf p27-candidate;mkdir -p p27-candidate;cp -a /tmp/p27-web/. p27-candidate/
          printf '%s\n' 'P27 candidate isolated. Active root untouched.' > p27-candidate/CANDIDATE.txt
          git add p27-candidate
          git diff --cached --quiet || git commit -m 'Publish repaired isolated P27 candidate'
          git push origin gh-pages
      - name: Wait for Pages propagation
        run: sleep 20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Full 56-case public HTTPS QA
        shell: bash
        run: |
          cat > /tmp/qa.mjs <<'EOF'
          import {chromium,webkit} from 'playwright';import fs from 'fs';
          const base='https://lgquidal-glitch.github.io/atlas-tools/p27-candidate';
          const tools=[['tennis-command','tennis'],['tennis-deep','tennis'],['tennis-fusion','tennis'],['football-command','football'],['football-deep','football'],['football-fusion','football'],['calibration','calibration']];
          const profiles=[['android',390,844],['iphone',393,852],['ipad',820,1180],['desktop',1366,768]];const browsers=[['chromium',chromium],['webkit',webkit]];const results=[];fs.mkdirSync('/tmp/p27shots',{recursive:true});
          for(const [bn,bt] of browsers){const b=await bt.launch({headless:true});for(const [tn,kind] of tools)for(const [pn,w,h] of profiles){const c=await b.newContext({viewport:{width:w,height:h}}),p=await c.newPage();const pe=[],ce=[],rf=[];p.on('pageerror',e=>pe.push(String(e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});p.on('requestfailed',r=>rf.push({url:r.url(),error:r.failure()?.errorText||''}));let status=0,overflow=true,bodyChars=0,diag={};try{const rr=await p.goto(`${base}/${tn}/index.html`,{waitUntil:'domcontentloaded',timeout:90000});status=rr?.status()||0;await p.waitForTimeout(4500);bodyChars=(await p.locator('body').innerText()).length;overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);diag=await p.evaluate(kind=>({feed:!!(kind==='tennis'?window.ATLAS_TENNIS_SOURCE_FEED:kind==='football'?window.ATLAS_FOOT_SOURCE_FEED:window.ATLAS_CALIBRATION_SOURCE_FEED),live:(kind==='tennis'?window.ATLAS_TENNIS_LIVE_STATUS:kind==='football'?window.ATLAS_FOOT_LIVE_STATUS:window.ATLAS_CALIBRATION_LIVE_STATUS)||null,resources:performance.getEntriesByType('resource').map(x=>x.name)}),kind);await p.screenshot({path:`/tmp/p27shots/${tn}__${pn}__${bn}.png`,fullPage:true});}catch(e){pe.push(String(e))}const critical=ce.filter(x=>/cors|failed to fetch|networkerror|espn/i.test(x));const espn=(diag.resources||[]).filter(x=>/site\.api\.espn\.com/i.test(x)).length;const ownFailed=rf.filter(x=>x.url.startsWith(base));const pass=status===200&&bodyChars>100&&!overflow&&!pe.length&&!critical.length&&!espn&&diag.feed&&diag.live&&diag.live.ok!==false&&!ownFailed.length;results.push({browser:bn,tool:tn,profile:pn,status,bodyChars,overflow,pageErrors:pe,consoleErrors:ce,failedRequests:rf,diag:{feed:diag.feed,live:diag.live},espnRequests:espn,pass});await c.close()}await b.close()}
          const summary={total:results.length,pass:results.filter(x=>x.pass).length,fail:results.filter(x=>!x.pass).length,results};fs.writeFileSync('/tmp/p27-runtime-repair.json',JSON.stringify(summary,null,2));console.log(JSON.stringify({total:summary.total,pass:summary.pass,fail:summary.fail},null,2));if(summary.fail)process.exit(1);
          EOF
          node /tmp/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p27-repaired-runtime-qa
          path: |
            /tmp/p27-runtime-repair.json
            /tmp/p27shots/
