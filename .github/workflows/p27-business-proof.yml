name: P27 published business proof
on:
  push:
    branches: [p27-consolidation-candidate]
    paths:
      - '.github/workflows/p27-business-proof.yml'
      - 'web/tennis-resilient-loader.js'
      - 'web/football-resilient-loader.js'
      - 'web/data/**'
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p27-consolidation-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Test all six published sports interfaces with 6 rendered matches each
        shell: bash
        run: |
          cat > p27-business-proof.mjs <<'EOF'
          import {chromium,webkit} from 'playwright';
          import fs from 'fs';
          const base='https://lgquidal-glitch.github.io/atlas-tools/p27-candidate';
          const targets=[
            {kind:'tennis',tool:'tennis-command',path:'tennis-command/index.html'},
            {kind:'tennis',tool:'tennis-deep',path:'tennis-deep/index.html'},
            {kind:'tennis',tool:'tennis-fusion',path:'tennis-fusion/index.html'},
            {kind:'football',tool:'football-command',path:'football-command/index.html'},
            {kind:'football',tool:'football-deep',path:'football-deep/index.html'},
            {kind:'football',tool:'football-fusion',path:'football-fusion/index.html'}
          ];
          const profiles=[['android',chromium,390,844],['ipad-webkit',webkit,820,1180]];
          fs.mkdirSync('p27/business-proof',{recursive:true});
          const report={generatedAt:new Date().toISOString(),base,targets:[]};
          for(const t of targets){
            const tr={kind:t.kind,tool:t.tool,profiles:[]};
            for(const [profile,bt,w,h] of profiles){
              const browser=await bt.launch({headless:true});
              const ctx=await browser.newContext({viewport:{width:w,height:h}});
              const page=await ctx.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              let status=0,proof={};
              try{
                const r=await page.goto(`${base}/${t.path}?proof=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:90000});status=r?.status()||0;
                await page.waitForTimeout(7000);
                proof=await page.evaluate(kind=>{
                  const live=kind==='tennis'?window.ATLAS_TENNIS_LIVE_STATUS:window.ATLAS_FOOT_LIVE_STATUS;
                  const feed=kind==='tennis'?window.ATLAS_TENNIS_SOURCE_FEED:window.ATLAS_FOOT_SOURCE_FEED;
                  const nodes=[...document.querySelectorAll('[data-atlas-feed-match="1"]')].slice(0,6);
                  const six=nodes.map(n=>({text:(n.innerText||'').trim(),visible:!!(n.offsetWidth||n.offsetHeight||n.getClientRects().length)}));
                  const body=(document.body.innerText||'');
                  return {live,feedPresent:!!feed,renderedCount:document.querySelectorAll('[data-atlas-feed-match="1"]').length,six,bodyHasPre:/À venir/i.test(body),bodyHasLive:/En cours/i.test(body),bodyHasPost:/Terminé/i.test(body),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
                },t.kind);
                await page.screenshot({path:`p27/business-proof/${t.tool}__${profile}.png`,fullPage:true});
              }catch(e){errors.push(String(e));}
              const six=proof.six||[];
              const sixVisible=six.length>=6&&six.every(x=>x.visible&&x.text.length>3);
              const pass=status===200&&!errors.length&&proof.feedPresent&&proof.live?.ok!==false&&!proof.overflow&&sixVisible;
              tr.profiles.push({profile,status,errors,proof,sixVisible,pass});
              await ctx.close();await browser.close();
            }
            report.targets.push(tr);
          }
          report.pass=report.targets.every(t=>t.profiles.every(p=>p.pass));
          fs.writeFileSync('p27/candidate-qa/business-proof.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.pass)process.exitCode=1;
          EOF
          mkdir -p p27/candidate-qa
          node p27-business-proof.mjs
      - name: Commit proof report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p27/candidate-qa/business-proof.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Record P27 published business proof'
          git push origin HEAD:p27-consolidation-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p27-business-proof
          path: |
            p27/candidate-qa/business-proof.json
            p27/business-proof/
