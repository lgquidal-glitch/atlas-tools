name: QA public ATLAS runtime

on:
  issues:
    types: [opened]

jobs:
  qa:
    if: startsWith(github.event.issue.title, 'ATLAS-RUNTIME-QA')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Run public runtime QA
        shell: bash
        run: |
          cat > qa-atlas.mjs <<'EOF'
          import { chromium, webkit } from 'playwright';
          import fs from 'fs';
          const base='https://raw.githack.com/lgquidal-glitch/atlas-tools/main/web';
          const tools=[
            ['tennis-command','tennis-command/index.html'],
            ['tennis-deep','tennis-deep/index.html'],
            ['tennis-fusion','tennis-fusion/index.html'],
            ['football-command','football-command/index.html'],
            ['football-deep','football-deep/index.html'],
            ['football-fusion','football-fusion/index.html'],
            ['calibration','calibration/index.html']
          ];
          const profiles=[
            ['android',390,844],['iphone',393,852],['ipad',820,1180],['desktop',1366,768]
          ];
          const browsers=[['chromium',chromium],['webkit',webkit]];
          fs.mkdirSync('qa-public-screenshots',{recursive:true});
          const results=[];
          for (const [bn,bt] of browsers){
            const browser=await bt.launch({headless:true});
            for (const [tn,path] of tools){
              for (const [pn,w,h] of profiles){
                const ctx=await browser.newContext({viewport:{width:w,height:h}});
                const page=await ctx.newPage();
                const errors=[]; const consoles=[];
                page.on('pageerror',e=>errors.push(String(e)));
                page.on('console',m=>{ if(m.type()==='error') consoles.push(m.text()); });
                let status=0, title='', overflow=false, bodyChars=0, ok=false;
                try{
                  const r=await page.goto(`${base}/${path}`,{waitUntil:'domcontentloaded',timeout:90000});
                  status=r?.status()||0;
                  await page.waitForTimeout(1200);
                  title=await page.title();
                  bodyChars=(await page.locator('body').innerText()).length;
                  overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
                  ok=status===200 && bodyChars>100 && !overflow && errors.length===0;
                  await page.screenshot({path:`qa-public-screenshots/${tn}__${pn}__${bn}.png`,fullPage:true});
                }catch(e){errors.push(String(e));}
                results.push({browser:bn,tool:tn,profile:pn,status,title,bodyChars,overflow,pageErrors:errors,consoleErrors:consoles.slice(0,10),pass:ok});
                await ctx.close();
              }
            }
            await browser.close();
          }
          const summary={total:results.length,pass:results.filter(x=>x.pass).length,fail:results.filter(x=>!x.pass).length,results};
          fs.writeFileSync('qa-public-runtime.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify({total:summary.total,pass:summary.pass,fail:summary.fail},null,2));
          if(summary.fail) process.exitCode=1;
          EOF
          node qa-atlas.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-public-runtime-qa
          path: |
            qa-public-runtime.json
            qa-public-screenshots/
